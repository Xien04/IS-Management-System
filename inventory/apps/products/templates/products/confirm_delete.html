{% extends "base.html" %}

{% block title %}Delete Product - Inventory Sales{% endblock %}
{% block page_class %}theme-products{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-header">Delete Product</div>
        <p>Are you sure you want to delete {{ product.name }}</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button class="btn-danger btn" type="submit">Delete</button>
                <a class="btn-secondary btn" href="{% url 'products:list' %}">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
